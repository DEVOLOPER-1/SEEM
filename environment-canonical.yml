dependencies:
  - python=3.13.14
  - pip
  - pip:
      - agentpy==0.1.5
      - osmnx==2.1.1
      - r5py==1.1.7
      - geopandas==1.1.4
      - shapely==2.1.2
      - pandas==2.3.3
